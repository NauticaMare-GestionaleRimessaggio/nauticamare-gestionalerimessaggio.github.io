<style>
/* Layout: app scura a schermo pieno — barra in alto, sezioni con titolo e link "Vedi tutto", riquadri a due colonne con indicatori ad anello, calendario mensile a celle con barre colorate, barra a 5 sezioni in basso */
:root {
  color-scheme: dark;
  --bg: #000000;
  --bar: #0E0E10;
  --card: #1E1F23;
  --card-2: #2C2D32;
  --cell: #2A2B30;
  --cell-out: #151619;
  --line: #34363C;
  --track: #33353B;
  --ink: #F4F5F7;
  --muted: #A0A3AC;
  --dim: #6E717A;
  --accent: #2F8FF0;
  --accent-ink: #FFFFFF;
  --late: #F2473D; --soon: #FF9E2C; --ok: #38C172;
  --late-bg: rgba(242, 71, 61, .17); --soon-bg: rgba(255, 158, 44, .17); --ok-bg: rgba(56, 193, 114, .16); --accent-bg: rgba(47, 143, 240, .18);
  --vio: #A983FF; --vio-bg: rgba(169, 131, 255, .18);
  --brand: #06002E;
  --scrim: rgba(0, 0, 0, .62);
  --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 12px;
}
html, body { min-height: 100%; background: var(--bg); }
body {
  color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.4;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body.locked { overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Barra in alto */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bar);
  display: grid; grid-template-columns: 96px minmax(0, 1fr) 96px; align-items: center;
  padding: 8px 8px; min-height: 54px;
}
.top .l { display: flex; justify-content: flex-start; gap: 4px; }
.top .r { display: flex; justify-content: flex-end; gap: 4px; }
.top h1 { margin: 0; text-align: center; font-size: 1.05rem; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn {
  position: relative; width: 42px; height: 42px; border: 0; background: none; color: var(--ink);
  display: inline-flex; align-items: center; justify-content: center; border-radius: 50%;
}
.icon-btn svg { width: 25px; height: 25px; }
.icon-btn.blue { color: var(--accent); }
.icon-btn .dot {
  position: absolute; top: 4px; right: 2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--late); color: #fff; font-size: .68rem; font-weight: 700; display: flex; align-items: center; justify-content: center;
}

.app { max-width: 720px; margin: 0 auto; padding-inline: 14px; padding-block: 4px calc(100px + env(safe-area-inset-bottom, 0px)); }

/* Sezioni */
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 26px 2px 12px; }
.sec-h h2 { margin: 0; font-size: 1.3rem; font-weight: 700; letter-spacing: -.01em; }
.link { border: 0; background: none; color: var(--accent); font-size: .95rem; padding: 4px 0; white-space: nowrap; }

/* Bottoni */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 38px; padding: 8px 16px; border-radius: 6px; border: 0;
  background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: .92rem; white-space: nowrap;
}
.btn.sec { background: var(--card-2); color: var(--ink); }
.btn.danger { background: var(--late); color: #fff; }
.btn.danger-ghost { background: transparent; color: var(--late); box-shadow: inset 0 0 0 1.5px var(--late); }
.btn:disabled { opacity: .5; cursor: default; }
.btn svg { width: 17px; height: 17px; }
.mini { border: 0; background: var(--card-2); color: var(--accent); font-size: .78rem; font-weight: 650; padding: 4px 9px; border-radius: 6px; margin-left: 8px; }

/* Carosello in primo piano */
.feat { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; margin-inline: -14px; scrollbar-width: none; }
.feat::-webkit-scrollbar { display: none; }
.feat-w { flex: 0 0 100%; padding-inline: 14px; scroll-snap-align: start; min-width: 0; }
.feat-card { background: var(--card); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; height: 100%; }
.feat-top { display: flex; gap: 12px; align-items: flex-start; }
.ic-circle { flex: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--accent); color: #fff; }
.ic-circle svg { width: 22px; height: 22px; }
.ic-circle.late { background: var(--late); } .ic-circle.soon { background: var(--soon); } .ic-circle.ok { background: var(--ok); }
.feat-title { font-size: 1.3rem; font-weight: 650; line-height: 1.2; overflow-wrap: anywhere; }
.feat-sub { color: var(--muted); font-size: .9rem; margin-top: 2px; }
.feat-status { font-size: .95rem; font-weight: 600; }
.feat-acts { display: flex; gap: 8px; flex-wrap: wrap; }
.dots { display: flex; justify-content: center; gap: 7px; margin-top: 12px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
.dots i.on { background: var(--ink); }

/* Riquadri In breve */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tile {
  background: var(--card); border: 0; border-radius: var(--r); padding: 12px 12px 14px; min-width: 0;
  display: flex; flex-direction: column; gap: 8px; text-align: left; color: var(--ink);
}
button.tile:active { background: var(--card-2); }
.tile-h { display: flex; align-items: center; gap: 7px; font-size: .9rem; font-weight: 500; line-height: 1.2; }
.tile-h svg { width: 17px; height: 17px; flex: none; display: block; }
.tile .gauge, .tile .ring { width: 100%; max-width: 116px; align-self: center; display: block; }
.g-num { fill: var(--ink); font: 500 25px var(--font-body); font-variant-numeric: tabular-nums; }
.g-sub { fill: var(--muted); font: 500 10px var(--font-body); }
.big { font-size: 1.55rem; font-weight: 500; line-height: 1.05; font-variant-numeric: tabular-nums; }
.big small { font-size: .9rem; color: var(--muted); font-weight: 500; }
.cap { font-size: .82rem; color: var(--muted); line-height: 1.3; }
.t-late { color: var(--late); } .t-soon { color: var(--soon); } .t-ok { color: var(--ok); } .t-acc { color: var(--accent); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.stack b { display: block; font-size: 1.45rem; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
.stack span { display: block; font-size: .8rem; color: var(--muted); margin-top: 3px; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: .78rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; }
.week span { display: flex; align-items: center; justify-content: center; height: 18px; }
.week span.today { color: var(--ink); font-weight: 700; }
.week span.done { color: var(--ink); }
.week svg { width: 13px; height: 13px; }
.bars { width: 100%; height: auto; display: block; }
.axis { display: flex; justify-content: space-between; font-size: .72rem; color: var(--muted); margin-top: -2px; }

/* Liste */
.group { background: var(--card); border-radius: var(--r); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-width: 0; }
.group > .row + .row, .group > .kv-row + .kv-row { border-top: 1px solid var(--line); }
button.row, .row .hit { width: 100%; border: 0; background: none; text-align: left; color: var(--ink); }
.row .hit { display: flex; align-items: center; gap: 12px; padding: 0; flex: 1; min-width: 0; }
button.row:active, .row .hit:active { opacity: .65; }
.main { flex: 1; min-width: 0; }
.title, .sub, .status { display: block; }
.title { font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.sub { color: var(--muted); font-size: .86rem; line-height: 1.35; overflow-wrap: anywhere; margin-top: 2px; }
.status { font-size: .86rem; font-weight: 600; margin-top: 3px; }
.status.late { color: var(--late); } .status.soon { color: var(--soon); } .status.ok { color: var(--ok); }
.side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
.amount { font-size: .86rem; font-variant-numeric: tabular-nums; color: var(--ink); }
.dblock {
  flex: none; width: 50px; height: 52px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: var(--card-2); color: var(--ink); text-align: center;
}
.dblock b { font-size: 1.25rem; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.dblock b.sm { font-size: .9rem; }
.dblock small { font-size: .64rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; margin-top: 4px; color: inherit; opacity: .85; }
.dblock.late { background: var(--late-bg); color: var(--late); }
.dblock.soon { background: var(--soon-bg); color: var(--soon); }
.dblock.ok { background: var(--ok-bg); color: var(--ok); }
.chk {
  flex: none; display: inline-flex; align-items: center; gap: 4px; border: 0; background: var(--card-2); color: var(--ink);
  font-size: .82rem; font-weight: 600; padding: 8px 10px; border-radius: 6px; min-height: 36px;
}
.chk svg { width: 15px; height: 15px; color: var(--ok); }
.chk.on { background: var(--ok-bg); color: var(--ok); }
.pan-bars { padding: 6px 14px; }
.pan-bar { display: grid; grid-template-columns: minmax(0, 38%) 1fr auto; align-items: center; gap: 10px; padding: 7px 0; font-size: .88rem; }
.pan-bar + .pan-bar { border-top: 1px solid var(--line); }
.pan-l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
.pan-t { height: 10px; background: var(--card-2); border-radius: 4px; overflow: hidden; }
.pan-t i { display: block; height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; }
.pan-v { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 52px; text-align: right; }
.pill svg { width: 12px; height: 12px; margin-right: 2px; }
.group.pan .kv-row .k { flex: 1 1 55%; min-width: 0; }
.group.pan .kv-row .v { flex: 0 1 auto; min-width: 0; }
.pill { display: inline-flex; align-items: center; white-space: nowrap; padding: 2px 8px; border-radius: 999px; font-size: .74rem; font-weight: 600; background: var(--card-2); color: var(--muted); }
.pill.late { background: var(--late-bg); color: var(--late); } .pill.soon { background: var(--soon-bg); color: var(--soon); }
.pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.acc { background: var(--accent-bg); color: var(--accent); }
.posto {
  flex: none; min-width: 56px; max-width: 92px; padding: 4px 6px; border: 1.5px solid var(--ink); border-radius: 4px;
  font-family: var(--font-data); font-weight: 600; font-size: .76rem; letter-spacing: .05em; text-transform: uppercase;
  text-align: center; line-height: 1.2; overflow-wrap: anywhere;
}
.posto.empty { border-style: dashed; border-color: var(--dim); color: var(--dim); }

/* Stati vuoti e avvisi */
.empty { background: var(--card); border-radius: var(--r); padding: 22px 18px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; }
.empty .ic-circle { background: var(--card-2); color: var(--ink); width: 46px; height: 46px; }
.empty h3 { margin: 4px 0 0; font-size: 1.08rem; font-weight: 650; }
.empty p { margin: 0; color: var(--muted); font-size: .92rem; max-width: 36ch; }
.empty .acts { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; align-items: center; }
.notice { background: var(--card); border-radius: var(--r); padding: 18px; color: var(--muted); }
.banner { background: var(--card); border-radius: var(--r); padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: .9rem; margin-top: 12px; }
.banner p { margin: 0; flex: 1 1 220px; color: var(--muted); }
.banner .acts { display: flex; gap: 8px; }

/* Filtri e ricerca */
.chips { display: flex; gap: 8px; margin-top: 12px; overflow-x: auto; scrollbar-width: none; }
.chips button { flex: none; border: 0; background: var(--card); color: var(--muted); padding: 8px 14px; border-radius: 999px; font-size: .9rem; font-weight: 600; }
.chips button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.search { position: relative; margin-top: 12px; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 18px; height: 18px; pointer-events: none; }
.search input { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--card); border: 1px solid transparent; border-radius: 10px; padding: 10px 12px 10px 38px; }
.gq-bar { display: block; width: 100%; font: inherit; font-size: 16px; text-align: left; color: var(--muted); background: var(--card); border: 1px solid transparent; border-radius: 10px; padding: 10px 12px 10px 38px; cursor: pointer; }
.gq-bar span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.search input:focus { outline: none; border-color: var(--accent); }
.month-h { display: flex; justify-content: space-between; align-items: baseline; margin: 22px 2px 8px; color: var(--muted); font-size: .85rem; font-weight: 600; }
.month-h span:first-child { text-transform: capitalize; color: var(--ink); font-size: .95rem; }

/* Calendario */
.cal-nav { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
.cal-nav h2 { margin: 0; font-size: 1rem; font-weight: 600; text-transform: capitalize; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; margin-inline: -8px; }
.dow { text-align: center; font-size: .8rem; color: var(--muted); padding: 6px 0 4px; }
.day {
  position: relative; border: 0; border-radius: 3px; background: var(--cell); color: var(--ink); text-align: left;
  min-height: 64px; padding: 4px 3px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0;
}
.day.out { background: var(--cell-out); color: var(--dim); }
.day.today { box-shadow: inset 0 0 0 1.5px var(--accent); }
.day.sel { box-shadow: inset 0 0 0 2px var(--ink); }
.day .n { font-size: .78rem; line-height: 1; margin-bottom: 3px; font-variant-numeric: tabular-nums; }
.day i { display: block; height: 5px; border-radius: 1px; background: var(--accent); }
.day i.late { background: var(--late); } .day i.soon { background: var(--soon); } .day i.ok { background: var(--ok); }
.day i.grey { background: var(--dim); } .day i.teal { background: #3BC0C9; }
.sd-sum .row .pill { margin-left: 0; }
.day i.stripe { background: repeating-linear-gradient(135deg, var(--accent) 0 3px, transparent 3px 5px); }
.day .more { position: absolute; right: 3px; bottom: 2px; font-size: .62rem; font-weight: 600; color: var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: .78rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 16px; height: 5px; border-radius: 1px; }

/* Scheda barca */
.hero { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-top: 10px; }
.hero h2 { margin: 6px 0 0; font-size: 2.2rem; font-weight: 700; line-height: 1.02; letter-spacing: -.02em; overflow-wrap: anywhere; }
.hero .model { color: var(--muted); margin-top: 6px; }
.hero .posto { font-size: .95rem; padding: 8px; margin-top: 4px; max-width: 120px; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.kv-row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 12px 14px; }
.kv-row .k { flex: none; color: var(--muted); font-size: .9rem; }
.kv-row .v { min-width: 0; text-align: right; font-weight: 500; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.kv-row .sel { user-select: all; -webkit-user-select: all; }
.notes { padding: 12px 14px; white-space: pre-wrap; overflow-wrap: anywhere; }

/* Scheda lavoro */
.av { width: 32px; height: 32px; border-radius: 50%; flex: none; object-fit: cover; background: var(--card-2); }
.av-i { display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .85rem; color: var(--ink); }
.me-card { background: var(--card); border-radius: var(--r); padding: 14px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 12px; }
.nome-row { display: flex; gap: 8px; width: 100%; }
.nome-row input { flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.nome-row input:focus { outline: none; border-color: var(--accent); }
.day-t { text-transform: none !important; text-align: center; }
.center { text-align: center; }
.day-sum { background: var(--card); border-radius: var(--r); padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; }
.day-sum .big { display: block; font-size: 2rem; }
.person + .person { margin-top: 16px; }
.person-h { display: flex; align-items: center; gap: 10px; margin: 0 2px 8px; }
.person-h .title { flex: 1; min-width: 0; }
.person-h .tot { font-weight: 650; font-variant-numeric: tabular-nums; }
.dblock.hrs { background: var(--accent-bg); color: var(--accent); }
.wk { display: grid; grid-template-columns: minmax(0, 1fr) repeat(7, 26px) 48px; gap: 3px; align-items: center; padding: 12px; font-size: .78rem; font-variant-numeric: tabular-nums; }
.wk .hd { color: var(--muted); text-align: center; }
.wk .hd.on { color: var(--accent); font-weight: 700; }
.wk .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .86rem; font-weight: 600; }
.wk .c { border: 0; font: inherit; color: var(--ink); text-align: center; padding: 5px 0; border-radius: 4px; background: var(--card-2); min-width: 0; }
.wk .c.z { background: transparent; color: var(--dim); }
.wk .c.sel { box-shadow: inset 0 0 0 1.5px var(--accent); }
.wk .t { text-align: right; font-weight: 700; }

/* Modifiche dopo la conferma */
.strike { text-decoration: line-through; color: var(--muted); }
.prev { display: block; margin-top: 5px; font-size: .8rem; line-height: 1.35; color: var(--muted); overflow-wrap: anywhere; }
.prev s { color: var(--muted); }
.when { font-size: .78rem; color: var(--dim); }

/* Logo */
.splash { position: fixed; inset: 0; z-index: 60; background: var(--brand); display: flex; align-items: center; justify-content: center; padding: 24px; transition: opacity .45s ease; }
.splash img { width: 84%; max-width: 440px; height: auto; }
.splash.out { opacity: 0; pointer-events: none; }
@media (prefers-reduced-motion: no-preference) {
  .splash img { animation: logo-in .8s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes logo-in { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
}
@media (prefers-reduced-motion: reduce) { .splash { transition: none; } }
.top .logo { display: block; height: 26px; width: auto; max-width: 100%; margin: 0 auto; object-fit: contain; }
.doc-logo { display: block; height: 30px; width: auto; max-width: 100%; margin-bottom: 10px; }

  var PREV_STATI = [['bozza', 'Da inviare'], ['inviato', 'Inviato'], ['accettato', 'Accettato'], ['rifiutato', 'Rifiutato']];
  var PREV_PILL = { bozza: '', inviato: 'acc', accettato: 'ok', rifiutato: 'late' };
  function prevStato(k) { var x = PREV_STATI.find(function (s) { return s[0] === k; }); return x ? x[1] : 'Da inviare'; }
  function prevOre(p) { var t = 0; (p.voci || []).forEach(function (v) { t += num(v.ore) || 0; }); return t; }
  function prevLavori(p) { return (p.lavIds || []).map(function (id) { return S.lavoriAll.find(function (l) { return l.id === id; }); }).filter(Boolean); }
  function prevConfronto(p) { // ore previste e vere dei lavori già fatti

    return { prev: prev, vere: vere, fatti: fatti, tot: tot };
  }
  function prevRow(p, showBoat) {

    if ((p.foto || []).length) sub.push(p.foto.length + ' foto');
    var st = '<span class="pill ' + (PREV_PILL[p.stato] || '') + '">' + esc(prevStato(p.stato)) + '</span>';
    if (c && c.tot) st += ' <span class="pill' + (c.fatti === c.tot ? ' ok' : '') + '">' + c.fatti + '/' + c.tot + ' lavori fatti</span>' + (c.fatti ? ' <span class="pill ' + (c.vere > c.prev * 1.1 ? 'late' : 'ok') + '">' + esc(fmtH(c.vere)) + ' su ' + esc(fmtH(c.prev)) + ' previste</span>' : '');

  function viewPreventivi() {
    var f = V.prevFilter || 'aperti', all = (S.prev || []).slice().sort(function (a, c) { return String(c.data || '').localeCompare(String(a.data || '')); });

    var h = '<div class="chips" role="group" aria-label="Filtro preventivi">' + [['aperti', 'Da inviare e inviati'], ['accettato', 'Accettati'], ['rifiutato', 'Rifiutati'], ['tutti', 'Tutti']].map(function (o) {

    return h + (list.length ? '<div class="group">' + list.map(function (p) { return prevRow(p, true); }).join('') + '</div>' : '<div class="notice">Nessun preventivo in questa lista.</div>');

  function prevVoceRow(v) {

        (c && c.tot ? '<div class="lbl">Ore previste e ore vere</div><div class="group pan">' + lavs.map(function (l) {
          return '<div class="kv-row"><span class="k">' + esc(l.titolo || 'Lavoro') + '</span><span class="v">' + (l.stato === 'fatto' ? esc(fmtH(num(l.oreLavoro) || 0) + ' su ' + fmtH(num(l.oreStima) || 0)) : esc(l.stato === 'in_corso' ? 'in corso' : 'da fare')) + '</span></div>';
        }).join('') + (c.fatti ? '<div class="kv-row"><span class="k"><b>Totale lavori fatti</b></span><span class="v ' + (c.vere > c.prev * 1.1 ? 't-late' : 't-ok') + '">' + esc(fmtH(c.vere) + ' su ' + fmtH(c.prev) + ' previste') + '</span></div>' : '') + '</div>' : ''),
      onOpen: function (f) {
        function tot() { var t = 0; Array.prototype.forEach.call(f.querySelectorAll('.pv-o'), function (x) { t += parseDec(x.value) || 0; }); $('#pv-tot').textContent = t ? 'Totale previsto: ' + fmtH(t) : ''; }

        f.addEventListener('click', function (e) {
          var a = e.target.closest && e.target.closest('[data-act]'); if (!a) return;
          if (a.getAttribute('data-act') === 'pv-add') { e.stopPropagation(); $('#pv-box').insertAdjacentHTML('beforeend', prevVoceRow({})); var r = f.querySelectorAll('.pv-t'); r[r.length - 1].focus(); }
          else if (a.getAttribute('data-act') === 'pv-del') { e.stopPropagation(); var row = a.closest('.pv-row'); if (f.querySelectorAll('.pv-row').length > 1) row.remove(); else { row.querySelector('.pv-t').value = ''; row.querySelector('.pv-o').value = ''; } tot(); }

      onSubmit: async function (f) {

  /* ---------- Scadenze del cantiere: mezzi, attrezzature e sicurezza, separate da quelle delle barche ---------- */
  var SC_GRUPPI = [['mezzi', 'Mezzi e attrezzature'], ['sicurezza', 'Sicurezza del cantiere']];
  var SC_RIF = { mezzi: ['Gru', 'Travel lift', 'Muletto', 'Carrello', 'Furgone', 'Camion', 'Trattore', 'Compressore', 'Idropulitrice'],
    sicurezza: ['Estintori', 'Cassetta di pronto soccorso', 'Impianto elettrico', 'Impianto di messa a terra', 'Luci di emergenza', 'Uscite di emergenza', 'DVR (documento valutazione rischi)'] };
  var SC_TIPI = { mezzi: ['Revisione', 'Assicurazione', 'Bollo', 'Tagliando', 'Verifica periodica', 'Verifica funi e catene', 'Ingrassaggio', 'Manutenzione'],
    sicurezza: ['Revisione', 'Controllo periodico', 'Verifica periodica', 'Sostituzione', 'Reintegro', 'Aggiornamento'] };
  function scGruppo(k) { var g = SC_GRUPPI.find(function (x) { return x[0] === k; }); return g ? g[1] : 'Cantiere'; }
  function scInfo(s) {
    var days = s.data ? daysUntil(s.data) : null, level = 'ok';
    if (days != null && days < 0) level = 'late'; else if (days != null && days <= 30) level = 'soon';
    var text = days == null ? '' : days < 0 ? 'Scaduta da ' + (-days) + (days === -1 ? ' giorno' : ' giorni') : days === 0 ? 'Scade oggi' : days === 1 ? 'Scade domani' : 'Tra ' + days + ' giorni';
    return { level: level, text: text, days: days };
  }
  function scOpen() { return (S.scadC || []).filter(function (s) { return !s.fatta; }).map(function (s) { return { s: s, i: scInfo(s) }; }).sort(function (a, b) { return String(a.s.data || '9').localeCompare(String(b.s.data || '9')); }); }
  function scRow(x) {
    var s = x.s, i = x.i, done = !!s.fatta, lvl = done ? '' : i.level, sub = [s.rif || scGruppo(s.gruppo)];
    if (num(s.ricorrenzaMesi)) sub.push('si ripete ogni ' + s.ricorrenzaMesi + (+s.ricorrenzaMesi === 1 ? ' mese' : ' mesi'));
    if (s.ultimaIl) sub.push('ultima fatta il ' + fmtDate(s.ultimaIl));
    var status = done ? '<span class="status ok">Fatta il ' + esc(fmtDate(s.fattaIl)) + '</span>' : (i.text ? '<span class="status ' + lvl + '">' + esc(i.text) + '</span>' : '');
    var btn = (!done && S.canWrite) ? '<button type="button" class="chk" data-act="sc-done" data-id="' + esc(s.id) + '">' + I.check + 'Fatto</button>' : '';
    return '<div class="row"><button type="button" class="hit" data-act="sc-edit" data-id="' + esc(s.id) + '">' + dateBlock(done ? s.fattaIl : s.data, lvl) +
      '<span class="main"><span class="title">' + esc(s.tipo || 'Scadenza') + '</span><span class="sub">' + esc(sub.join(' · ')) + '</span>' + status + '</span></button>' + btn + '</div>';
  }
  function scCounts() { var o = scOpen(); return { late: o.filter(function (x) { return x.i.level === 'late'; }).length, soon: o.filter(function (x) { return x.i.level === 'soon'; }).length }; }
  function viewScadCantiere() {
    var open = scOpen(), h = '<p class="context" style="margin-top:12px">Scadenze dei vostri mezzi, delle attrezzature e della sicurezza del cantiere. Sono separate da quelle delle barche dei clienti.</p>';

        else { var fc = f.querySelector('#f-scf'); data.fatta = !!(fc && fc.checked); if (data.fatta && !s.fatta) data.fattaIl = todayISO(); var r2 = S.db.collection('scadCantiere').doc(s.id); ok = await w(function () { return r2.update(data); }); }
        if (ok) toast(isNew ? 'Scadenza aggiunta' : 'Scadenza salvata');

      }
    });

  async function scDone(s) { // fatta: se si ripete passa alla prossima data, e resta lo storico
    var t = todayISO(), n = num(s.ricorrenzaMesi), ref = S.db.collection('scadCantiere').doc(s.id), now = new Date().toISOString();
    var st = (s.storico || []).concat([{ data: s.data || '', fattaIl: t, da: S.myId || '' }]);
    var upd = n > 0 ? { data: addMonths(t, n), ultimaIl: t, storico: st, modificato: now } : { fatta: true, fattaIl: t, storico: st, modificato: now };

  async function bkPick(f) {
    if (!f || BK.busy || !S.db || S.status !== 'ready') return;
    if (f.size > 40 * 1024 * 1024) { toast('Questo file non è una copia dei dati di Nautica Mare.', true); return; }
    var txt = null, data = null;
    try { txt = await f.text(); } catch (e) { toast('Non riesco a leggere il file.', true); return; }
    try { data = JSON.parse(String(txt).replace(/^﻿/, '')); } catch (e) { data = null; }
    if (!isObj(data) || data.app !== 'Nautica Mare' || !isObj(data.collezioni)) { toast('Questo file non è una copia dei dati di Nautica Mare.', true); return; }
    BK.busy = 'check'; render();
    var miss = {}, tot = 0, all = 0;
    try {
      for (var i = 0; i < BK_COLL.length; i++) {
        var name = BK_COLL[i][0], src = data.collezioni[name];
        if (!isObj(src)) continue;
        var ids = Object.keys(src).filter(function (id) {
          return BK_ID.test(id) && id !== '.' && id !== '..' && isObj(src[id]) && !(name === 'impostazioni' && id !== 'mappa');
        });
        all += ids.length;
        if (!ids.length) continue;
        var snap = await bkGet(name), have = {};
        snap.docs.forEach(function (d) { if (d.exists !== false) have[d.id] = 1; });
        var list = ids.filter(function (id) { return !have[id]; });
        if (list.length) { miss[name] = list; tot += list.length; }
      }
    } catch (e) {
      BK.busy = false; render(); toast('Controllo non riuscito: controlla la connessione e riprova.', true); return;
    }
    BK.busy = false; render();
    BK.src = data; BK.miss = miss;
    var head = '<p class="cap" style="margin:0">' + (data.creata ? 'Copia del ' + esc(fmtWhen(data.creata)) : 'Copia senza data') + (data.creataDa ? ' · fatta da ' + esc(data.creataDa) : '') + ' · ' + nVoci(all) + '</p>';
    if (!tot) {
      openSheet({ title: 'Ripristino', menu: true, body: head + '<div class="notice" style="margin-top:12px">Nell’app c’è già tutto quello che contiene questa copia: non c’è niente da recuperare.</div>' });
      return;
    }
    var rows = BK_COLL.filter(function (x) { return miss[x[0]]; }).map(function (x) {
      var name = x[0], ids = miss[name], ex = [];
      for (var k = 0; k < ids.length && ex.length < 3; k++) { var s = bkItem(name, data.collezioni[name][ids[k]], data.collezioni); if (s) ex.push(s); }
      var more = ids.length - ex.length;
      var sub = ex.length ? esc(ex.join(', ')) + (more > 0 ? ' e ' + fmtNum(more) + ' in più' : '') : '';
      return '<div class="ck"><label><input type="checkbox" data-rs="' + esc(name) + '" checked><span class="t"><b>' + esc(x[1]) + '</b> · ' + fmtNum(ids.length) +
        (sub ? '<span class="cap" style="display:block;margin-top:2px">' + sub + '</span>' : '') + '</span></label></div>';
    });
    openSheet({
      title: 'Ripristino', submitLabel: 'Recupera',
      body: head + '<p style="margin:12px 2px 8px">Nell’app ' + (tot === 1 ? 'manca <b>1 voce</b> che è nella copia' : 'mancano <b>' + nVoci(tot) + '</b> che sono nella copia') + '. Scegli cosa rimettere:</p><div class="group">' + rows.join('') + '</div>' +
        '<p class="cap" style="margin:10px 2px 0">Quello che c’è già nell’app non viene toccato, anche se è stato modificato dopo la copia.</p><p class="cap" id="rs-prog" style="margin:10px 2px 0;color:var(--accent)" hidden></p>',
      onSubmit: async function (form) {
        var names = Array.prototype.map.call(form.querySelectorAll('input[data-rs]:checked'), function (x) { return x.getAttribute('data-rs'); });
        if (!names.length) { formErr('Scegli almeno una voce da recuperare.'); return false; }
        Array.prototype.forEach.call(form.querySelectorAll('input[data-rs]'), function (x) { x.disabled = true; });
        BK.busy = 'restore'; render();
        var r = await bkRestore(names, function (k, n) { var p = $('#rs-prog'); if (p) { p.hidden = false; p.textContent = 'Recupero ' + fmtNum(k) + ' di ' + fmtNum(n) + '…'; } });
        BK.busy = false; BK.src = null; BK.miss = null; render();
        if (r.stop === 'quota_exceeded') toast('Spazio dati esaurito: recuperate ' + nVoci(r.done) + '.', true);
        else if (r.stop) toast('Accesso ai dati non più disponibile: recuperate ' + nVoci(r.done) + '. Ricarica la pagina.', true);
        else if (r.fail) toast('Recuperate ' + nVoci(r.done) + ', ' + fmtNum(r.fail) + ' non riuscite: riprova con lo stesso file.', true);
        else if (!r.done) toast('Era già tutto presente nell’app');
        else toast('Recuperate ' + nVoci(r.done));
        return true;
      }
    });
  }

  async function bkRestore(names, prog) {
    var r = { done: 0, skip: 0, fail: 0, stop: null }, n = 0, k = 0;
    names.forEach(function (nm) { n += (BK.miss[nm] || []).length; });
    outer:
    for (var i = 0; i < names.length; i++) {
      var name = names[i], ids = BK.miss[name] || [], src = BK.src.collezioni[name];
      for (var j = 0; j < ids.length; j++) {
        k++; prog(k, n);
        var ref = S.db.collection(name).doc(ids[j]), ok = false, code = null;
        for (var a = 0; a < 3 && !ok; a++) {
          try {
            var cur = await ref.get();
            if (cur.exists) { r.skip++; ok = true; break; }
            await ref.set(src[ids[j]]); r.done++; ok = true;
          } catch (e) {
            code = e && e.code;
            if (code === 'unavailable' || code === 'resource_exhausted') { await wait(800 * (a + 1) + Math.random() * 600); continue; }
            break;
          }
        }
        if (!ok) {
          r.fail++;
          if (code === 'quota_exceeded' || code === 'revoked' || code === 'not_granted') { r.stop = code; break outer; }
        }
      }
    }
    return r;
  }

  function doneScadSheet(s) {
